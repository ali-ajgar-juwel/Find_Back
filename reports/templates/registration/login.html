{% extends 'reports/base.html' %}{% block title %}Log in{% endblock %}{% block content %}<div class="card shadow-sm mx-auto" style="max-width:480px"><div class="card-body p-4"><h1 class="h3 mb-3">Log in</h1><form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="btn btn-primary w-100">Log in</button></form><p class="mt-3 mb-0">New here? <a href="{% url 'signup' %}">Create an account</a></p></div></div><script>document.querySelectorAll('input').forEach(el=>el.classList.add('form-control','mb-3'))</script>{% endblock %}
